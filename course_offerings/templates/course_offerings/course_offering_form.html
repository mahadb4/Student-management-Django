{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% if offering %}
            Edit Course Offering
        {% else %}
            Add Course Offering
        {% endif %}
    </title>

    <link
        rel="stylesheet"
        href="{% static 'css/tailwind.min.css' %}"
    >

    <link
        rel="stylesheet"
        href="{% static 'css/custom.css' %}"
    >

</head>

<body class="bg-gray-50 text-gray-800 font-sans antialiased">

<div class="max-w-3xl mx-auto py-8 px-4">

    <div class="bg-white shadow rounded-lg p-6">

        <h1 class="text-3xl font-bold text-gray-900 mb-6">

            {% if offering %}
                Edit Course Offering
            {% else %}
                Add Course Offering
            {% endif %}

        </h1>

        {% if error %}

            <div class="mb-6 p-4 rounded-md bg-red-50 text-red-700 border border-red-200">
                {{ error }}
            </div>

        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="mb-4">

                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Course
                </label>

                <select
                    name="course"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md"
                    required
                >

                    <option value="">
                        Select Course
                    </option>

                    {% for course in courses %}

                        <option
                            value="{{ course.id }}"
                            {% if offering.course_id == course.id %}
                                selected
                            {% endif %}
                        >

                            {{ course.code }} - {{ course.name }}

                        </option>

                    {% endfor %}

                </select>

            </div>

            <div class="mb-4">

                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Teacher
                </label>

                <select
                    name="teacher"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md"
                    required
                >

                    <option value="">
                        Select Teacher
                    </option>

                    {% for teacher in teachers %}

                        <option
                            value="{{ teacher.id }}"
                            {% if offering.teacher_id == teacher.id %}
                                selected
                            {% endif %}
                        >

                            {{ teacher.first_name }}
                            {{ teacher.last_name }}

                        </option>

                    {% endfor %}

                </select>

            </div>

            <div class="mb-4">

                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Semester
                </label>

                <select
                    name="semester"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md"
                    required
                >

                    <option value="">
                        Select Semester
                    </option>

                    <option
                        value="SPRING"
                        {% if offering.semester == "SPRING" %}
                            selected
                        {% endif %}
                    >
                        Spring
                    </option>

                    <option
                        value="SUMMER"
                        {% if offering.semester == "SUMMER" %}
                            selected
                        {% endif %}
                    >
                        Summer
                    </option>

                    <option
                        value="FALL"
                        {% if offering.semester == "FALL" %}
                            selected
                        {% endif %}
                    >
                        Fall
                    </option>

                </select>

            </div>

            <div class="mb-4">

                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Academic Year
                </label>

                <input
                    type="number"
                    name="academic_year"
                    value="{{ offering.academic_year|default:'' }}"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md"
                    min="2000"
                    required
                >

            </div>

            <div class="mb-4">

                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Section
                </label>

                <input
                    type="text"
                    name="section"
                    value="{{ offering.section|default:'' }}"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md"
                    required
                >

            </div>

            <div class="mb-6">

                <label class="inline-flex items-center">

                    <input
                        type="checkbox"
                        name="is_active"
                        class="mr-2"
                        {% if not offering or offering.is_active %}
                            checked
                        {% endif %}
                    >

                    <span class="text-sm text-gray-700">
                        Active
                    </span>

                </label>

            </div>

            <div class="flex justify-between">

                <a
                    href="{% url 'course_offering_list' %}"
                    class="px-4 py-2 rounded-md bg-gray-200 text-gray-700 hover:bg-gray-300"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="px-4 py-2 rounded-md text-white bg-indigo-600 hover:bg-indigo-700"
                >

                    {% if offering %}
                        Update Course Offering
                    {% else %}
                        Create Course Offering
                    {% endif %}

                </button>

            </div>

        </form>

    </div>

</div>

</body>

</html>
