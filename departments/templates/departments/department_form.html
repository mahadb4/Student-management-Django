{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if department %}Update{% else %}Create{% endif %} Department</title>
    <link rel="stylesheet" href="{% static 'css/tailwind.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/custom.css' %}">
</head>

<body class="bg-gray-50 text-gray-800">
<div class="max-w-3xl mx-auto py-10 px-4">

    <div class="bg-white shadow rounded-lg p-6">

        <h1 class="text-2xl font-bold mb-6">
            {% if department %}
                Update Department
            {% else %}
                Create Department
            {% endif %}
        </h1>

        {% if error %}
            <div class="mb-5 p-4 bg-red-50 text-red-700 border border-red-200 rounded-md">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST" class="space-y-5">
            {% csrf_token %}

            <div>
                <label class="block text-sm font-medium mb-1">Name</label>
                <input type="text"
                       name="name"
                       value="{{ department.name|default:'' }}"
                       required
                       class="w-full border rounded-md px-3 py-2">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Code</label>
                <input type="text"
                       name="code"
                       value="{{ department.code|default:'' }}"
                       required
                       class="w-full border rounded-md px-3 py-2">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Description</label>
                <textarea name="description"
                          rows="4"
                          class="w-full border rounded-md px-3 py-2">{{ department.description|default:'' }}</textarea>
            </div>

            <div>
                <label class="flex items-center gap-2">
                    <input type="checkbox"
                           name="is_active"
                           {% if not department or department.is_active %}checked{% endif %}>
                    <span>Active</span>
                </label>
            </div>

            <div class="flex justify-end gap-3 pt-4">

                <a href="{% url 'department_list' %}"
                   class="px-4 py-2 bg-gray-200 rounded-md">
                    Cancel
                </a>

                <button type="submit"
                        class="px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700">
                    {% if department %}Update Department{% else %}Create Department{% endif %}
                </button>

            </div>

        </form>

    </div>

</div>
</body>
</html>
