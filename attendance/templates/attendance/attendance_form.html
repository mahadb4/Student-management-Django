{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% if attendance %}
            Edit Attendance
        {% else %}
            Add Attendance
        {% endif %}
    </title>

    <link rel="stylesheet" href="{% static 'css/tailwind.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/custom.css' %}">

</head>

<body class="bg-gray-50 text-gray-800 font-sans antialiased">

<div class="max-w-3xl mx-auto py-8 px-4">

    <div class="bg-white shadow rounded-lg p-6">

        <h1 class="text-3xl font-bold text-gray-900 mb-6">

            {% if attendance %}
                Edit Attendance
            {% else %}
                Add Attendance
            {% endif %}

        </h1>

        {% if error %}

            <div class="mb-6 p-4 rounded-md bg-red-50 text-red-700 border border-red-200">
                {{ error }}
            </div>

        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="mb-4">

                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Student
                </label>

                <select
                    name="student"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md"
                    required
                >

                    <option value="">
                        Select Student
                    </option>

                    {% for student in students %}

                        <option
                            value="{{ student.id }}"
                            {% if attendance.student_id == student.id %}
                                selected
                            {% endif %}
                        >
                            {{ student.first_name }}
                            {{ student.last_name }}
                        </option>

                    {% endfor %}

                </select>

            </div>

            <div class="mb-4">

                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Course
                </label>

                <select
                    name="course"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md"
                    required
                >

                    <option value="">
                        Select Course
                    </option>

                    {% for course in courses %}

                        <option
                            value="{{ course.id }}"
                            {% if attendance.course_id == course.id %}
                                selected
                            {% endif %}
                        >
                            {{ course.code }} - {{ course.name }}
                        </option>

                    {% endfor %}

                </select>

            </div>

            <div class="mb-4">

                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Date
                </label>

                <input
                    type="date"
                    name="date"
                    value="{{ attendance.date|date:'Y-m-d' }}"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md"
                    required
                >

            </div>

            <div class="mb-4">

                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Status
                </label>

                <select
                    name="status"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md"
                    required
                >

                    <option value="">
                        Select Status
                    </option>

                    <option
                        value="PRESENT"
                        {% if attendance.status == "PRESENT" %}
                            selected
                        {% endif %}
                    >
                        Present
                    </option>

                    <option
                        value="ABSENT"
                        {% if attendance.status == "ABSENT" %}
                            selected
                        {% endif %}
                    >
                        Absent
                    </option>

                    <option
                        value="LATE"
                        {% if attendance.status == "LATE" %}
                            selected
                        {% endif %}
                    >
                        Late
                    </option>

                </select>

            </div>

            <div class="mb-6">

                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Remarks
                </label>

                <textarea
                    name="remarks"
                    rows="4"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md"
                >{{ attendance.remarks|default:'' }}</textarea>

            </div>

            <div class="flex justify-between">

                <a
                    href="{% url 'attendance_list' %}"
                    class="px-4 py-2 rounded-md bg-gray-200 text-gray-700 hover:bg-gray-300"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="px-4 py-2 rounded-md text-white bg-indigo-600 hover:bg-indigo-700"
                >

                    {% if attendance %}
                        Update Attendance
                    {% else %}
                        Create Attendance
                    {% endif %}

                </button>

            </div>

        </form>

    </div>

</div>

</body>
</html>
