name: CI/CD

on:
  push:
    branches: [dev, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: student_management
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ci-test-secret-key
      AWS_ACCESS_KEY_ID: ci-dummy
      AWS_SECRET_ACCESS_KEY: ci-dummy
      AWS_STORAGE_BUCKET_NAME: ci-dummy-bucket
      AWS_S3_REGION_NAME: us-east-1
      GEMINI_API_KEY: ci-dummy
      DB_NAME: student_management
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      REDIS_URL: redis://localhost:6379/1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check

      - name: Run Django tests
        run: python manage.py test

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    env:
      EC2_INSTANCE_ID: i-014f5ed80e9332786

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "uri=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy to EC2 via SSM
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          python3 - <<'EOF'
          import base64, json, os
          script = base64.b64encode(open("deploy/deploy.sh", "rb").read()).decode()
          commands = [
              "set -e",
              "mkdir -p /home/ec2-user/student-management/deploy",
              "cd /home/ec2-user/student-management",
              f"echo {script} | base64 -d > deploy/deploy.sh",
              "chmod +x deploy/deploy.sh",
              f"./deploy/deploy.sh {os.environ['IMAGE_TAG']}",
          ]
          json.dump({"commands": commands}, open("ssm-params.json", "w"))
          EOF

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy ${IMAGE_TAG}" \
            --timeout-seconds 900 \
            --parameters file://ssm-params.json \
            --query Command.CommandId --output text)
          echo "SSM command: $COMMAND_ID"

          STATUS=Pending
          for _ in $(seq 1 120); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Pending|InProgress|Delayed) ;;
              *) break ;;
            esac
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}' --output yaml || true

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed with SSM status: $STATUS"
            exit 1
          fi
