services:
  web:
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE to the ECR image URI}
    command: ["gunicorn", "student_ms.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "3", "--timeout", "120"]
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DEBUG: "False"
      REDIS_URL: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
