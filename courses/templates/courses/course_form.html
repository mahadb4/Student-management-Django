{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% if course %}
            Edit Course
        {% else %}
            Add Course
        {% endif %}
    </title>

    <link rel="stylesheet" href="{% static 'css/tailwind.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/custom.css' %}">
</head>

<body class="bg-gray-50 text-gray-800 font-sans antialiased">

<div class="max-w-3xl mx-auto py-8 px-4">

    <div class="bg-white shadow rounded-lg p-6">

        <h1 class="text-3xl font-bold text-gray-900 mb-6">

            {% if course %}
                Edit Course
            {% else %}
                Add Course
            {% endif %}

        </h1>

        {% if error %}
            <div class="mb-6 p-4 rounded-md bg-red-50 text-red-700 border border-red-200">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="mb-4">

                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Course Name
                </label>

                <input
                    type="text"
                    name="name"
                    value="{{ course.name|default:'' }}"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md"
                    required
                >

            </div>

            <div class="mb-4">

                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Course Code
                </label>

                <input
                    type="text"
                    name="code"
                    value="{{ course.code|default:'' }}"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md"
                    required
                >

            </div>

            <div class="mb-4">

                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Description
                </label>

                <textarea
                    name="description"
                    rows="4"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md"
                >{{ course.description|default:'' }}</textarea>

            </div>

            <div class="mb-4">

                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Credits
                </label>

                <input
                    type="number"
                    name="credits"
                    value="{{ course.credits|default:'' }}"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md"
                    min="1"
                    required
                >

            </div>

            <div class="mb-4">

                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Department
                </label>

                <select
                    name="department"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md"
                    required
                >

                    <option value="">
                        Select Department
                    </option>

                    {% for department in departments %}

                        <option
                            value="{{ department.id }}"
                            {% if course.department_id == department.id %}
                                selected
                            {% endif %}
                        >
                            {{ department.name }}
                        </option>

                    {% endfor %}

                </select>

            </div>

            <div class="mb-6">

                <label class="inline-flex items-center">

                    <input
                        type="checkbox"
                        name="is_active"
                        class="mr-2"
                        {% if not course or course.is_active %}
                            checked
                        {% endif %}
                    >

                    <span class="text-sm text-gray-700">
                        Active
                    </span>

                </label>

            </div>

            <div class="flex justify-between">

                <a
                    href="{% url 'course_list' %}"
                    class="px-4 py-2 rounded-md bg-gray-200 text-gray-700 hover:bg-gray-300"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="px-4 py-2 rounded-md text-white bg-indigo-600 hover:bg-indigo-700"
                >
                    {% if course %}
                        Update Course
                    {% else %}
                        Create Course
                    {% endif %}
                </button>

            </div>

        </form>

    </div>

</div>

</body>
</html>
