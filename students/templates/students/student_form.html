{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Form</title>

    <link rel="stylesheet" href="{% static 'css/tailwind.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/custom.css' %}">
</head>

<body class="bg-gray-50 text-gray-800 font-sans antialiased">

<div class="max-w-3xl mx-auto py-10 px-4">

    <div class="bg-white shadow rounded-lg">

        <div class="px-6 py-5 border-b">
            <h1 class="text-2xl font-bold">

                {% if student.id %}
                    Update Student
                {% else %}
                    Create Student
                {% endif %}

            </h1>
        </div>

        <div class="p-6">

            {% if error %}
                <div class="bg-red-100 text-red-700 border border-red-300 rounded p-3 mb-5">
                    <strong>Error</strong><br>
                    {{ error }}
                </div>
            {% endif %}

            <form method="POST">

                {% csrf_token %}

                <div class="grid grid-cols-2 gap-4">

                    <div>
                        <label>First Name</label>

                        <input
                            type="text"
                            name="first_name"
                            required
                            value="{{ student.first_name|default:'' }}"
                            class="border rounded w-full p-2">
                    </div>

                    <div>
                        <label>Last Name</label>

                        <input
                            type="text"
                            name="last_name"
                            required
                            value="{{ student.last_name|default:'' }}"
                            class="border rounded w-full p-2">
                    </div>

                    <div class="col-span-2">
                        <label>Email</label>

                        <input
                            type="email"
                            name="student_email"
                            required
                            value="{{ student.student_email|default:'' }}"
                            class="border rounded w-full p-2">
                    </div>

                    <div>
                        <label>Parents Phone</label>

                        <input
                            type="text"
                            name="parents_phone_number"
                            required
                            value="{{ student.parents_phone_number|default:'' }}"
                            class="border rounded w-full p-2">
                    </div>

                    <div>
                        <label>Date of Birth</label>

                        <input
                            type="date"
                            name="date_of_birth"
                            required
                            value="{{ student.date_of_birth|default:'' }}"
                            class="border rounded w-full p-2">
                    </div>

                    <div>
                        <label>Gender</label>

                        <select
                            name="gender"
                            required
                            class="border rounded w-full p-2">

                            <option value="">Select</option>

                            <option value="M"
                            {% if student.gender == "M" %}
                                selected
                            {% endif %}
                            >
                                Male
                            </option>

                            <option value="F"
                            {% if student.gender == "F" %}
                                selected
                            {% endif %}
                            >
                                Female
                            </option>

                        </select>
                    </div>

                    <div>
                        <label>Student Group</label>

                        <input
                            type="text"
                            name="student_group"
                            required
                            value="{{ student.student_group|default:'' }}"
                            class="border rounded w-full p-2">
                    </div>

                    <div class="col-span-2">
                        <label>Address</label>

                        <textarea
                            name="address"
                            rows="4"
                            class="border rounded w-full p-2">{{ student.address|default:'' }}</textarea>
                    </div>

                    <div class="col-span-2">

                        <label class="flex items-center gap-2">

                            <input
                                type="checkbox"
                                name="is_active"
                                {% if student.is_active %}
                                    checked
                                {% endif %}
                            >

                            Active Student

                        </label>

                    </div>

                </div>

                <div class="mt-6 flex justify-end gap-3">

                    <a
                        href="{% url 'student_list' %}"
                        class="border px-5 py-2 rounded">

                        Cancel

                    </a>

                    <button
                        class="bg-indigo-600 text-white px-5 py-2 rounded">

                        {% if student.id %}
                            Update Student
                        {% else %}
                            Create Student
                        {% endif %}

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
